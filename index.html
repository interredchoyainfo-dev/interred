<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" href="/favicon.ico" />
    <title>INTER RED | Sistema de Gestión y Cobros</title>
    
    <!-- Redirección rápida si ya hay sesión activa -->
    <script>
        try {
            const session = JSON.parse(sessionStorage.getItem('auth') || '{}');
            if (session && session.auth) {
                window.location.replace('dashboard.html');
            }
        } catch (e) {}
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#E30613",
                  "on-primary": "#ffffff",
                  "background": "#ffffff",
                  "surface": "#ffffff",
                  "on-surface": "#121212",
                  "surface-variant": "#f4f4f4",
                  "on-surface-variant": "#4a4a4a",
                  "outline": "#d1d1d1",
                  "outline-variant": "#e5e5e5",
                  "secondary": "#121212",
                  "error": "#E30613"
                },
                fontFamily: {
                  "headline": ["Plus Jakarta Sans", "sans-serif"],
                  "body": ["Plus Jakarta Sans", "sans-serif"],
                  "label": ["Plus Jakarta Sans", "sans-serif"]
                },
                borderRadius: {
                  "DEFAULT": "0.5rem",
                  "lg": "0.5rem",
                  "xl": "0.5rem",
                  "full": "9999px"
                },
              },
            },
          }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 1);
            border: 1px solid #e5e5e5;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0d0d11;
            background-image: radial-gradient(circle at 50% 0%, rgba(227, 6, 19, 0.15) 0%, transparent 60%);
            color: #ffffff;
        }
    </style>
</head>
<body class="font-body min-h-screen flex flex-col justify-center items-center px-4 sm:px-6 py-8">
    <!-- Main Content -->
    <main class="w-full max-w-[460px] relative z-10">
        <!-- Login Card -->
        <div class="glass-panel p-6 sm:p-10 rounded-2xl shadow-2xl bg-[#141419] border border-white/10 text-white">
            <!-- Brand Anchor -->
            <div class="flex flex-col items-center mb-8">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-3 bg-red-600/10 border border-red-500/20 rounded-xl">
                        <span class="material-symbols-outlined text-3xl text-primary" data-icon="payments">payments</span>
                    </div>
                    <span class="font-headline text-3xl font-extrabold tracking-tighter text-white">
                        <span class="text-primary">INTER</span> RED
                    </span>
                </div>
                <p class="font-headline text-lg font-bold text-gray-200">Sistema de Gestión de Cobros</p>
                <p class="text-xs text-gray-400 mt-1 font-medium">Ingresa tus credenciales de administrador</p>
            </div>

            <form id="login-form" class="space-y-5">
                <!-- Username Field -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider" for="username">Usuario</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-4 flex items-center text-gray-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl" data-icon="person">person</span>
                        </div>
                        <input class="w-full pl-12 pr-4 py-3.5 bg-[#1e1e26] border border-white/10 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-white placeholder:text-gray-500 text-sm font-medium" id="username" placeholder="Usuario administrador" type="text" autocomplete="username" required/>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider" for="password">Contraseña</label>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-4 flex items-center text-gray-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
                        </div>
                        <input class="w-full pl-12 pr-12 py-3.5 bg-[#1e1e26] border border-white/10 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-white placeholder:text-gray-500 text-sm font-medium" id="password" placeholder="••••••••" type="password" autocomplete="current-password" required/>
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-white transition-colors">
                            <span class="material-symbols-outlined text-xl" id="toggle-password-icon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Error Message Area -->
                <div id="error-alert" class="hidden bg-red-500/10 border border-red-500/40 text-red-400 px-4 py-3 rounded-xl text-xs font-bold" role="alert">
                    Datos incorrectos. Intente de nuevo.
                </div>

                <!-- Submit Button -->
                <button class="w-full bg-primary hover:bg-[#c40510] text-white font-headline font-extrabold py-3.5 rounded-xl shadow-lg shadow-red-600/20 active:scale-[0.99] transition-all duration-200 mt-2 flex items-center justify-center gap-2 group text-sm tracking-wide" type="submit">
                    INGRESAR AL PANEL
                    <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </form>

            <!-- Support Footer -->
            <div class="mt-8 pt-6 border-t border-white/10 flex flex-col items-center gap-2">
                <p class="text-xs text-gray-400 text-center font-medium">
                    Panel exclusivo para administración de clientes, cobros y MikroTik.
                </p>
            </div>
        </div>

        <!-- Branding Subtle Footer -->
        <p class="text-center mt-6 text-xs font-semibold text-gray-500 uppercase tracking-widest">
            © 2026 Inter Red • Sistema Centralizado
        </p>
    </main>

    <!-- Visual Anchor: Solid Brand Line -->
    <div class="fixed bottom-0 left-0 w-full h-1 bg-primary"></div>

    <script>
        // Funcionalidad ver contraseña
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-password-icon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        async function performLogin(user, pass, onSlow) {
            const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
            
            const endpoints = isLocal 
                ? ['/api/auth/login', 'http://localhost:3000/api/auth/login', 'https://interred-api.onrender.com/api/auth/login']
                : ['https://interred-api.onrender.com/api/auth/login', '/api/auth/login'];

            let slowTimer = setTimeout(() => {
                if (typeof onSlow === 'function') onSlow();
            }, 3000);

            let lastError = null;
            for (const endpoint of endpoints) {
                try {
                    const controller = new AbortController();
                    // 40 seconds timeout for Render cold start
                    const timeoutId = setTimeout(() => controller.abort(), 40000);

                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user, pass }),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    clearTimeout(slowTimer);

                    const data = await res.json();
                    return data;
                } catch (err) {
                    lastError = err;
                }
            }
            clearTimeout(slowTimer);
            throw lastError || new Error('No se pudo conectar al servidor backend');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('error-alert');

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = `
                <span class="inline-block animate-spin mr-2">⏳</span> VERIFICANDO...
            `;
            submitBtn.disabled = true;

            try {
                const result = await performLogin(user, pass, () => {
                    submitBtn.innerHTML = `
                        <span class="inline-block animate-spin mr-2">🌐</span> CONECTANDO NUBE...
                    `;
                });
                
                if (result && result.success) {
                    if (result.token) {
                        sessionStorage.setItem('interred_api_token', result.token);
                    }
                    const session = {
                        auth: true,
                        time: Date.now(),
                        user: user
                    };
                    sessionStorage.setItem('auth', JSON.stringify(session));
                    window.location.href = 'dashboard.html';
                } else {
                    errorAlert.textContent = (result && result.message) || 'Datos incorrectos. Intente de nuevo.';
                    errorAlert.classList.remove('hidden');
                    setTimeout(() => errorAlert.classList.add('hidden'), 4000);
                }
            } catch (error) {
                errorAlert.textContent = 'Error de conexión con el servidor en la nube. Reintentá en unos segundos.';
                errorAlert.classList.remove('hidden');
                setTimeout(() => errorAlert.classList.add('hidden'), 5000);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
